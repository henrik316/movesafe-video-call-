services:
  web:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATA_DIR: /app/data
      TRUST_PROXY: "false"
    volumes:
      - movesafe-data:/app/data
    restart: unless-stopped

volumes:
  movesafe-data:
