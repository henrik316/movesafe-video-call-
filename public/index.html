<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4d3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MoveSafe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="MoveSafe Relocation video walkthroughs for moving estimates." />
    <title>MoveSafe Relocation</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      window.__movesafeInstall = { prompt: null, installed: false };
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        window.__movesafeInstall.prompt = event;
        window.dispatchEvent(new Event('movesafe-install-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.__movesafeInstall.prompt = null;
        window.__movesafeInstall.installed = true;
        window.dispatchEvent(new Event('movesafe-install-ready'));
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
